[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qml01c"
version = "0.0.1"
description = "CUDA-Q 相容子集：用 NumPy / PyTorch 在純 CPU（原生 Windows）上跑 CUDA-Q 語法的量子電路"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Poyuan Chung" }, { name = "Xin Yang" }]
keywords = ["quantum-computing", "cuda-q", "simulator", "education", "numpy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=2.0"]

[dependency-groups]
dev = ["pytest>=8"]

[project.optional-dependencies]
torch = ["torch>=2.4"]
qiskit = ["qiskit>=1.0"]
oracle = ["mpmath>=1.3"]
fast = ["numba>=0.60", "numpy>=2.0,<2.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/q01"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
